# NAS の Docker で常駐させる場合:
#   cd f1-hotel-monitor
#   cp .env.example .env && vi .env
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f
# 手動 1 回実行:
#   docker compose -f deploy/docker-compose.yml run --rm monitor python monitor.py run
services:
  monitor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: f1-hotel-monitor
    env_file:
      - ../.env
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ../data:/data
      - ../config.toml:/app/config.toml:ro
    restart: unless-stopped
