# 2027 F1日本GP 宿監視 設定
# 秘密情報（APIキー・トークン）は .env に置く。ここには置かない。

[stay]
# 検索する日程。2027 F1日本GP は 4/9(金) 予選日〜4/11(日) 決勝。
# 決勝翌日の月曜に帰る「金〜月」が本命。行を足せばそのまま検索対象が増える。
[[stay.ranges]]
checkin = "2027-04-09"    # 金
checkout = "2027-04-12"   # 月（3泊）※本命

[[stay.ranges]]
checkin = "2027-04-09"    # 金
checkout = "2027-04-11"   # 日（2泊）

[[stay.ranges]]
checkin = "2027-04-08"    # 木
checkout = "2027-04-11"   # 日（3泊）

[[stay.ranges]]
checkin = "2027-04-10"    # 土
checkout = "2027-04-12"   # 月（2泊）

# 人数パターン。すべてのパターン × 日程 × エリアで検索し、通知は別々に出す。
#   adults                 大人の人数（合計）
#   infants_no_meal_no_bed 幼児・食事なし布団なし＝添い寝（楽天 infantWithoutMBNum）
#   rooms                  部屋数
#   instant_price_per_night 1泊（全室合計）が この額以下なら「即」。未指定なら [thresholds] の値
[[stay.parties]]
label = "親子2人1室"
adults = 1
infants_no_meal_no_bed = 1
rooms = 1
instant_price_per_night = 25000

[[stay.parties]]
label = "4人1室"          # 大人3（本人＋祖父母）＋4歳児1
adults = 3
infants_no_meal_no_bed = 1
rooms = 1
instant_price_per_night = 60000

[[stay.parties]]
label = "4人2室"          # 同じ4人を2部屋に分ける
adults = 3
infants_no_meal_no_bed = 1
rooms = 2
instant_price_per_night = 60000

[thresholds]
# 人数パターンで instant_price_per_night を指定しない場合の既定値（1泊あたり）
instant_price_per_night = 25000

[schedule]
# 通常の実行時刻（JST）。`monitor.py schedule` と crontab の両方で使う
# キャンセル拾いのため 1 日 4 回。深夜〜早朝はキャンセル反映が多い
daily_times = ["07:00", "12:00", "18:00", "22:30"]
# 毎時 :20 にこのソースだけ追加で見る（キャンセル拾い。空文字で無効）
hourly_sources = "toyoko"
# 開放直後期は 1 時間毎（JST）。[開始日, 終了日] の両端を含む
dense_windows = [
  ["2026-11-01", "2026-11-03"],   # スーパーホテル鈴鹿 開放
  ["2027-01-13", "2027-01-22"],   # ルートイン 鈴鹿レース日 特別販売（2026年実績 1/15・1/20 14時）
]
# 指定日に 1 回だけ送るリマインド通知（開放日の見落とし防止）
[[schedule.reminders]]
date = "2026-10-31"
message = "明日 11/1 スーパーホテル鈴鹿 が 2027/4 分を開放予定。手動でも確認。"
[[schedule.reminders]]
date = "2027-01-10"
message = "ルートイン鈴鹿レース日 特別販売は例年 1月中旬 14時ネット限定。公式の告知を確認し、開放日に手動予約できる体制を。"

# 開放の瞬間だけ超短間隔で張り込む。秒単位で埋まるため
# スーパーホテルは「当月含む 6 か月先まで、毎月1日に開始。開始時刻は非公表」。
# 2026/11/1 に 2027/4 分が開放される。時刻が読めないので終日 1 分間隔で張り込む。
# 負荷を抑えるため、この間は本命日程・1 パターンだけを見る。
[[schedule.watch_windows]]
start = "2026-11-01T00:00"
end = "2026-11-02T00:00"
interval_seconds = 60
sources = "superhotel"
checkins = ["2027-04-09"]
parties = ["親子2人1室"]

# 同じ日、楽天側も 5 分間隔で張る。スーパーホテルは楽天・じゃらんでも売るため、
# 公式より OTA が先に開くこともある。1 リクエスト/秒の制限内に収まる間隔にする
[[schedule.watch_windows]]
start = "2026-11-01T00:00"
end = "2026-11-02T00:00"
interval_seconds = 300
sources = "rakuten"
checkins = ["2027-04-09"]
parties = ["親子2人1室", "4人2室"]

# 12/1・1/1 も同様に張る（4月分の追加放出や他ホテルの開放に備える）
[[schedule.watch_windows]]
start = "2026-12-01T00:00"
end = "2026-12-01T23:59"
interval_seconds = 300
sources = "superhotel"
checkins = ["2027-04-09"]
parties = ["親子2人1室"]

# ---------------------------------------------------------------------------
# 楽天トラベル VacantHotelSearch API
# ---------------------------------------------------------------------------
[rakuten]
hits = 30            # 1 ページ最大 30
max_pages = 5        # エリア×日程×人数あたりの最大ページ数
request_interval_sec = 1.05   # レート制限 1req/sec
timeout_sec = 20

# エリア定義。small_keywords / detail_keywords は GetAreaClass API の
# smallClassName / detailClassName に部分一致させる（コードのハードコード回避）。
# 実際の名称は `python monitor.py areas --middle mie` で確認して調整する。
# detail_keywords を指定すると、一致した detailClass ごとに検索して tier を細かく分ける。
# detail が一致しない場合は small 全体で検索する。
[[rakuten.areas]]
tier = 1
label = "鈴鹿・四日市"
middle = "mie"
small_keywords = ["鈴鹿", "四日市"]
detail_keywords = ["鈴鹿", "白子", "四日市"]

[[rakuten.areas]]
tier = 1
label = "津"
middle = "mie"
small_keywords = ["津"]
detail_keywords = ["津"]

[[rakuten.areas]]
tier = 2
label = "桑名・湯の山・亀山"
middle = "mie"
small_keywords = ["桑名", "湯の山", "亀山"]
detail_keywords = ["桑名", "長島", "湯の山", "菰野", "亀山"]

[[rakuten.areas]]
tier = 2
label = "松阪・伊勢"
middle = "mie"
small_keywords = ["松阪", "伊勢"]
detail_keywords = ["松阪", "伊勢"]

[[rakuten.areas]]
tier = 3
label = "名古屋"
middle = "aichi"
small_keywords = ["名古屋"]
detail_keywords = ["名古屋駅", "金山", "栄", "伏見"]

[[rakuten.areas]]
tier = 4
label = "名張・伊賀"
middle = "mie"
small_keywords = ["伊賀", "名張"]
detail_keywords = ["伊賀", "名張"]

[[rakuten.areas]]
tier = 4
label = "岐阜"
middle = "gifu"
small_keywords = ["岐阜"]
detail_keywords = ["岐阜駅", "岐阜市"]

# ---------------------------------------------------------------------------
# 東横INN（Playwright）
# ---------------------------------------------------------------------------
[toyoko]
# 空室検索ページの URL テンプレート。{code} {ci} {co} {adults} {rooms} が展開される。
# ※ 初回に `python monitor.py toyoko-dump` で実 URL・DOM を確認して調整する。
url_template = "https://www.toyoko-inn.com/search/reserve/room?hotel={code}&chkin={ci}&chkout={co}&adult={adults}&room={rooms}"
date_format = "%Y/%m/%d"
timeout_sec = 60
headless = true
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
locale = "ja-JP"
# 取得間隔（サイト負荷配慮）
request_interval_sec = 3.0
# 1 室あたりの大人の上限。これを超える人数パターンは検索しない（東横INN は 2 名程度）
max_adults_per_room = 2
# プラン要素の候補セレクタ（上から順に試し、最初に要素が見つかったものを使う）
plan_selectors = [".roomList .room", ".plan-list .plan", "li.room", "[class*=roomItem]", "[class*=plan]"]
name_selectors = [".roomName", ".room-name", "h3", "h4", "[class*=name]"]
price_selectors = [".price", "[class*=price]", "[class*=charge]"]
soldout_keywords = ["満室", "空室なし", "ご予約いただけません", "×"]

# 東横INN は小学生以下 1 名添い寝無料。人数パターンの adults / rooms が URL に展開される
# code は公式サイトのホテルページ URL（/search/detail/<code>/ など）から控える
# code は公式サイトの /search/detail/<code>/ から取得済み。
# 未設定（"00000"）のホテルを足した場合は、起動時に候補を
# data/toyoko_candidates.txt に書き出す
[[toyoko.hotels]]
code = "00273"          # https://www.toyoko-inn.com/search/detail/00273/
name = "東横INN津駅西口"
search_name = "津駅西口"
area_label = "津"
tier = 1

[[toyoko.hotels]]
code = "00267"          # https://www.toyoko-inn.com/search/detail/00267/
name = "東横INN近鉄四日市駅北口"
search_name = "四日市"
area_label = "四日市"
tier = 1

# 検索用 URL テンプレート（{q} に search_name が入る）
[toyoko.discover]
url_templates = [
  "https://www.toyoko-inn.com/search/result?keyword={q}",
  "https://www.toyoko-inn.com/china/search/result?keyword={q}",
  "https://www.toyoko-inn.com/hotel_list",
]

# ---------------------------------------------------------------------------
# 子連れ加点（キーワード判定）
# ---------------------------------------------------------------------------
[scoring]
walk_minutes_max = 5
breakfast_start_max = "06:30"
bath_keywords = ["大浴場", "温泉", "露天"]
family_room_keywords = ["ファミリー", "和洋室", "和室", "コネクティング", "フォース", "4名", "４名", "トリプル", "ツイン"]

# ---------------------------------------------------------------------------
# スーパーホテル（Playwright）。2027/4 分は 2026/11/1 開放見込み
# ---------------------------------------------------------------------------
[superhotel]
# 予約エンジンは reservation.jp。日付は YYYYMMDD、施設コードは sh-<name>
url_template = "https://go-superhotel.reservation.jp/ja/hotels/{code}/plans?checkin_date={ci}&checkout_date={co}&adults={adults}&child1={infants}&child2=0&child3=0&child4=0&child5=0&children={infants}&rooms={rooms}&dayuseFlg=0&sort=1&dateUndecidedFlg=0"
date_format = "%Y%m%d"
timeout_sec = 60
headless = true
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
locale = "ja-JP"
request_interval_sec = 2.0
max_adults_per_room = 3
# SPA なので描画待ちが要る。この文字列が出るまで待つ
wait_for_text = "プラン"
# 実 DOM（2026-09-18 に取得したページで確認）
#   プランカード: li.c-listRoom-item（売り切れは c-listRoom-item-disabled が付く）
#   プラン名:     h2.c-headingMain
#   価格:         .c-textPrice-total / .c-textPrice
plan_selectors = ["li.c-listRoom-item", ".c-listRoom-item", "[class*=listRoom-item]"]
name_selectors = ["h2.c-headingMain", ".c-headingMain", "h2", "h3"]
price_selectors = [".c-textPrice-total", ".c-textPrice", "[class*=textPrice]"]
# 売り切れは class で判る。本文は長いので文字列頼みにしない
soldout_class_keywords = ["disabled"]
# 本文には「1,000pt」などがあるので、価格はセレクタからのみ読む
price_from_selector_only = true
soldout_keywords = ["空室なし", "満室", "予約できるプランがありません", "受付前", "販売前", "予約できません"]

[[superhotel.hotels]]
code = "sh-suzuka"
name = "スーパーホテル鈴鹿"
area_label = "鈴鹿"
tier = 1
access = "鈴鹿"

# ---------------------------------------------------------------------------
# じゃらん（Playwright）。スーパーホテルは公式のほか楽天・じゃらん等でも売る。
# 公式の会員限定プランとは別枠なので、公式が満でも OTA に残ることがある。
#
# 有効にする手順:
#   1. じゃらんでスーパーホテル鈴鹿のページを開き、URL の yad 番号を控える
#   2. python monitor.py jalan-dump --url "<プラン一覧の URL>"
#      → data/jalan_sample.html が保存される
#   3. その HTML を見て plan_selectors / name_selectors / price_selectors を埋める
# url_template が TODO のうち、または plan_selectors が空のうちは
# このソースは黙ってスキップされる（run には影響しない）。
# ---------------------------------------------------------------------------
[jalan]
url_template = "TODO https://www.jalan.net/yad{code}/plan/?stayYear={ci_y}&stayMonth={ci_m}&stayDay={ci_d}&stayCount={nights}&roomCount={rooms}&adultNum={adults}"
date_format = "%Y-%m-%d"
timeout_sec = 60
headless = true
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
locale = "ja-JP"
request_interval_sec = 3.0
max_adults_per_room = 4
wait_for_text = "プラン"
# じゃらんの価格表示は「滞在合計・1室あたり」なので per_night ではなく total
price_basis = "total"
plan_selectors = []
name_selectors = []
price_selectors = []
soldout_class_keywords = []
price_from_selector_only = true
soldout_keywords = ["満室", "空室なし", "受付期間外", "予約できません"]

# [[jalan.hotels]]
# code = "TODO_yad番号"
# name = "スーパーホテル鈴鹿"
