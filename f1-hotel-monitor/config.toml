# ---------------------------------------------------------------------------
# 自動予約。開放と同時に取りに行く
# ---------------------------------------------------------------------------
[booking]
enabled = false          # ← 準備が終わったら true に（加えて環境変数 F1HOTEL_BOOKING=1 が必要）
dry_run = true           # ← true の間は確定ボタンを押さず手前で止まる
sources = ["superhotel"] # 自動予約を許可するソース
parties = ["4人2室", "親子2人1室"]   # このパターンのみ
prefer_parties = ["4人2室", "親子2人1室"]
max_total_price = 150000 # 合計がこれを超えたら実行しない（円）。前日まで無料なので押さえ優先
timeout_sec = 15
required_guest_fields = ["name", "kana", "phone", "email"]

# 無料キャンセルを確認できるプランだけ予約する（確認できなければ実行しない）
require_free_cancel = true
# 規定を人が確認済みのソース。スーパーホテルは「当日・無連絡のみ 100%」＝前日まで無料
# （2026-09-18 に予約画面のキャンセル料表示で確認）
free_cancel_sources = ["superhotel"]
no_cancel_keywords = ["返金不可", "キャンセル不可", "取消不可", "事前決済", "事前カード決済", "変更不可", "ノンリファンダブル"]
free_cancel_keywords = ["前日まで無料", "キャンセル無料", "無料キャンセル", "当日まで無料", "現地決済", "現地払い"]

# 予約する日程（未指定なら stay.ranges すべて）
[[booking.stays]]
checkin = "2027-04-09"
checkout = "2027-04-12"

# 予約フロー。実サイトを見てから selector を埋める（superhotel-dump のスクショ/HTML を使う）
[[booking.flows.superhotel]]
action = "goto"
value = "{url}"
[[booking.flows.superhotel]]
action = "shot"
value = "01_search"
[[booking.flows.superhotel]]
action = "click"
selector = "TODO_予約ボタン"
[[booking.flows.superhotel]]
action = "fill"
selector = "TODO_氏名"
value = "{name}"
[[booking.flows.superhotel]]
action = "fill"
selector = "TODO_カナ"
value = "{kana}"
[[booking.flows.superhotel]]
action = "fill"
selector = "TODO_電話"
value = "{phone}"
[[booking.flows.superhotel]]
action = "fill"
selector = "TODO_メール"
value = "{email}"
[[booking.flows.superhotel]]
action = "shot"
value = "02_form"
[[booking.flows.superhotel]]
action = "assert_text"
value = "{checkin_slash}"
[[booking.flows.superhotel]]
action = "submit"
selector = "TODO_予約を確定"
